# ============================================================================
# LiCore 官网配置文件
# ============================================================================
#
# 这是**官网自己**的配置，与 LiCore 引擎无关。
# （LiCore 引擎的配置是 ~/.licore/config.yaml，格式为 YAML，不在这里设置。）
#
# 修改本文件后需要**重启服务**才会生效（见 README「配置文件」一节）：
#   systemctl restart licore-website      # 或
#   pm2 restart licore-website
#
# 所有字段都是可选的：删掉某一项就会回退到内置默认值（本文件的注释里标注了）。
# 也可以用环境变量覆盖单个字段，环境变量优先级高于本文件。
# ============================================================================


# ----------------------------------------------------------------------------
# 站点信息
# ----------------------------------------------------------------------------
[site]
# 站点规范地址。用于 canonical / og:url / sitemap 的绝对地址。
# 换域名时改这里一处即可（等价环境变量 NUXT_PUBLIC_SITE_URL，优先级更高）。
url = "http://licore.z321.cc.cd"

# 站点名称，出现在 <title> 模板与页脚。
name = "LiCore"

# 页脚显示的备案号 / 版权补充信息。留空则只显示默认版权行。
# 例：icp = "京ICP备00000000号"
icp = ""


# ----------------------------------------------------------------------------
# 后台管理面板
# ----------------------------------------------------------------------------
# 访问地址：/admin
#
# ⚠️ 安全提示：面板部署在公网上时，请务必把下面的默认密码改掉。
#    默认值 admin / admin 仅用于本地首次登录。
[admin]
# 是否启用后台面板。设为 false 后 /admin 与 /api/admin/* 一律返回 404，
# 连登录页都无法访问（比只关登录更彻底）。
enabled = true

# 登录用户名。
username = "admin"

# 登录密码。**明文存储**，请自行确保本文件权限，不要提交真实密码到公开仓库。
password = "admin"

# 登录会话有效期（小时）。超过后需要重新登录。
sessionHours = 12

# 后台面板「缓存管理」里允许清理的缓存范围。
# true  = 允许在面板上一键清空 GitHub 数据缓存（会立即可重新拉取上游）
# false = 面板只读，不显示清理按钮
allowCacheClear = true

# 是否允许在后台面板上**可视化修改配置**。
# true  = 面板上可编辑 [site] 与 [display] 段的字段，保存后写回本文件并立即生效
#         （写入前会备份为 licore-site.toml.bak）
# false = 面板只展示配置，不提供编辑
#
# 注意：[admin] 段的密码/用户名与 [github].token 不在面板编辑范围内 ——
# token 有专门入口，密码刻意不提供在线修改（避免会话被窃取即等于丢密码）。
allowConfigEdit = true


# ----------------------------------------------------------------------------
# GitHub 上游数据
# ----------------------------------------------------------------------------
[github]
# 只读 token，用于把 API 配额从匿名 60 次/小时提升到 5000 次/小时。
#
# 建议改用环境变量 GITHUB_TOKEN 而不是写在这里（环境变量优先级更高），
# 因为本文件若被提交到仓库就等于泄露密钥。
#
# token = "ghp_xxxxxxxxxxxxxxxxxxxx"

# 各资源的缓存时长（秒），留空用内置默认值。
# 覆盖后会同时影响页面上的「服务端缓存 N 分钟」文案与 API 的 cache-control 头。
# releases = 300    # 发行版 / tag / 提交（默认 300 秒 = 5 分钟）
# repo = 600        # 仓库元信息（默认 600 秒 = 10 分钟）
# contributors = 1800  # 贡献者（默认 1800 秒 = 30 分钟）


# ----------------------------------------------------------------------------
# 页面展示
# ----------------------------------------------------------------------------
[display]
# 更新日志页每个版本默认展示的最大条目数，超出部分折叠。
# 留空或设为 0 表示不限制。
changelogMaxItems = 0

# 首页是否展示「最近提交」活动流。
showActivity = true
