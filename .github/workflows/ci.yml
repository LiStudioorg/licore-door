name: CI

# 只做校验：类型检查 + 生产构建 + 产物冒烟测试。
# 不部署 —— 部署见 deploy.yml。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送自动取消上一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # npm ci 严格按 package-lock.json 安装，保证可复现。
        # 本项目 .npmrc 指向 npmmirror，在海外 runner 上改用官方源更快。
        run: npm ci --registry=https://registry.npmjs.org

      - name: 类型检查
        run: |
          set -o pipefail
          # vue-tsc 会尝试加载 vue-router 的 volar 插件并打印一条无害的
          # ERR_PACKAGE_PATH_NOT_EXPORTED 警告，这里过滤掉以免干扰日志；
          # 真正的类型错误仍会让命令以非 0 退出。
          npm run typecheck 2>&1 | grep -v -e 'volar' -e 'ERR_PACKAGE_PATH_NOT_EXPORTED' -e 'Resolve plugin path failed'

      - name: 生产构建
        run: npm run build
        env:
          # 构建期只需要站点地址；GitHub 数据是运行时拉取的，这里不需要 token
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL || 'http://licore.z321.cc.cd' }}

      - name: 冒烟测试（启动产物并检查路由）
        env:
          # 显式指定端口，避免与 runner 上其他服务冲突
          PORT: 3001
          HOST: 127.0.0.1
        run: |
          set -euo pipefail
          node .output/server/index.mjs &
          SERVER_PID=$!
          # 确保无论成败都回收进程
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          echo "等待服务就绪…"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3001/; then
              echo "服务已就绪"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::服务 30 秒内未就绪"
              exit 1
            fi
            sleep 1
          done

          # 逐个路由断言 HTTP 200。
          # 注意：SSR 动态站点即使 GitHub 不可达也应返回 200（页面降级渲染），
          # 所以这里断言 200 是合理的，而不是断言页面里必须有实时数据。
          FAIL=0
          for path in / /changelog /download /docs /about /sitemap.xml /robots.txt; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3001${path}")
            if [ "$CODE" = "200" ]; then
              echo "  ✓ ${path} → ${CODE}"
            else
              echo "  ✗ ${path} → ${CODE}"
              FAIL=1
            fi
          done

          # 关键 SEO 标签必须存在
          echo "检查 SEO 标签…"
          HTML=$(curl -s http://127.0.0.1:3001/)
          for needle in '<title>' 'rel="canonical"' 'og:title' 'application/ld+json' 'name="description"'; do
            if echo "$HTML" | grep -q "$needle"; then
              echo "  ✓ ${needle}"
            else
              echo "  ✗ 缺少 ${needle}"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::冒烟测试未通过"
            exit 1
          fi
          echo "冒烟测试全部通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: licore-website-build
          path: .output
          retention-days: 7
          include-hidden-files: true
