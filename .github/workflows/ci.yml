name: CI

# 只做校验：类型检查 + 生产构建 + 产物冒烟测试 + 后台鉴权断言。
# 本仓库**不含**自动部署工作流：部署请按 DEPLOY.md 手动进行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送自动取消上一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # npm ci 严格按 package-lock.json 安装，保证可复现。
        # 本项目 .npmrc 指向 npmmirror，在海外 runner 上改用官方源更快。
        run: npm ci --registry=https://registry.npmjs.org

      - name: 类型检查
        run: |
          set -o pipefail
          # vue-tsc 会尝试加载 vue-router 的 volar 插件并打印一条无害的
          # ERR_PACKAGE_PATH_NOT_EXPORTED 警告，这里过滤掉以免干扰日志；
          # 真正的类型错误仍会让命令以非 0 退出。
          npm run typecheck 2>&1 | grep -v -e 'volar' -e 'ERR_PACKAGE_PATH_NOT_EXPORTED' -e 'Resolve plugin path failed'

      - name: 生产构建
        run: npm run build
        env:
          # 构建期只需要站点地址；GitHub 数据是运行时拉取的，这里不需要 token
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL || 'http://licore.z321.cc.cd' }}

      - name: 冒烟测试（启动产物并检查路由）
        env:
          # 显式指定端口。runner 是干净环境，3001 可用；
          # 若将来冲突，改这里一处即可（下面断言也用同一变量）
          PORT: 3001
          HOST: 127.0.0.1
          TEST_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          node .output/server/index.mjs &
          SERVER_PID=$!
          # 确保无论成败都回收进程
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          echo "等待服务就绪…"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$TEST_URL/"; then
              echo "服务已就绪"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::服务 30 秒内未就绪"
              exit 1
            fi
            sleep 1
          done

          # 逐个路由断言 HTTP 200。
          # 注意：SSR 动态站点即使 GitHub 不可达也应返回 200（页面降级渲染），
          # 所以这里断言 200 是合理的，而不是断言页面里必须有实时数据。
          FAIL=0
          for path in / /changelog /download /docs /about /admin /sitemap.xml /robots.txt; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${TEST_URL}${path}")
            if [ "$CODE" = "200" ]; then
              echo "  ✓ ${path} → ${CODE}"
            else
              echo "  ✗ ${path} → ${CODE}"
              FAIL=1
            fi
          done

          # 后台接口必须拒绝未登录访问（401）。这是安全底线，
          # 不能只靠人工记得测 —— 一旦鉴权被改坏，这里必须让 CI 变红。
          echo "检查后台鉴权…"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${TEST_URL}/api/admin/status")
          if [ "$CODE" = "401" ]; then
            echo "  ✓ /api/admin/status 未登录 → ${CODE}"
          else
            echo "  ✗ /api/admin/status 未登录返回 ${CODE}，应为 401（鉴权失效！）"
            FAIL=1
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${TEST_URL}/api/admin/config.set" \
            -H 'content-type: application/json' -d '{"patch":{"site.icp":"x"}}')
          if [ "$CODE" = "401" ]; then
            echo "  ✓ /api/admin/config.set 未登录 → ${CODE}"
          else
            echo "  ✗ /api/admin/config.set 未登录返回 ${CODE}，应为 401（未登录竟可写配置！）"
            FAIL=1
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${TEST_URL}/api/admin/login" \
            -H 'content-type: application/json' -d '{"username":"admin","password":"definitely-wrong"}')
          if [ "$CODE" = "401" ]; then
            echo "  ✓ 错误密码登录 → ${CODE}"
          else
            echo "  ✗ 错误密码登录返回 ${CODE}，应为 401（鉴权失效！）"
            FAIL=1
          fi

          # 展示配置接口必须可用，且**不得泄露敏感字段**。
          # 前端页面靠它拿可编辑的展示开关，它挂掉会让首页/更新日志页 500。
          echo "检查 /api/site-config…"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${TEST_URL}/api/site-config")
          if [ "$CODE" = "200" ]; then
            echo "  ✓ /api/site-config → ${CODE}"
          else
            echo "  ✗ /api/site-config 返回 ${CODE}，应为 200"
            FAIL=1
          fi

          curl -s "${TEST_URL}/api/site-config" -o /tmp/site-config.json
          for needle in 'showActivity' 'changelogMaxItems'; do
            if grep -q "$needle" /tmp/site-config.json; then
              echo "  ✓ 含 ${needle}"
            else
              echo "  ✗ 缺少 ${needle}"
              FAIL=1
            fi
          done
          # 这三个字段绝不能出现在公开响应里
          for needle in 'password' 'token' 'username'; do
            if grep -q "$needle" /tmp/site-config.json; then
              echo "  ✗ /api/site-config 泄露了 ${needle}"
              FAIL=1
            else
              echo "  ✓ 未泄露 ${needle}"
            fi
          done
          rm -f /tmp/site-config.json

          # 关键 SEO 标签必须存在。
          # 注意：这里刻意用临时文件而不是 `echo "$HTML" | grep -q`。
          # grep -q 匹配到就立刻退出，而 echo 还在往管道里写剩下的几十 KB，
          # 会触发 SIGPIPE 让 echo 以非 0 退出；本步骤开着 set -o pipefail，
          # 于是整个 pipeline 被误判为失败（<title> 在页首最容易踩中）。
          echo "检查 SEO 标签…"
          curl -s "$TEST_URL/" -o /tmp/smoke-home.html
          for needle in '<title>' 'rel="canonical"' 'og:title' 'application/ld+json' 'name="description"'; do
            if grep -q "$needle" /tmp/smoke-home.html; then
              echo "  ✓ ${needle}"
            else
              echo "  ✗ 缺少 ${needle}"
              FAIL=1
            fi
          done
          rm -f /tmp/smoke-home.html

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::冒烟测试未通过"
            exit 1
          fi
          echo "冒烟测试全部通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: licore-website-build
          path: .output
          retention-days: 7
          include-hidden-files: true
